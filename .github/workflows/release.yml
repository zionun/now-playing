name: Release

# Creates the GitHub release of a version tag, with the text of its CHANGELOG.md section.
# - automatically when a tag like v1.0.0 is pushed
# - by hand (Actions → Release → Run workflow) for a tag that already exists,
#   e.g. one created on an older commit
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag, e.g. v0.9.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node scripts/release-notes.mjs "$TAG" > release-notes.md
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # 0.x versions and versions like 1.0.0-rc.1 are pre-releases
          if [[ "$TAG" =~ ^v0\. || "$TAG" == *-* ]]; then
            echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV"
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag $PRERELEASE
